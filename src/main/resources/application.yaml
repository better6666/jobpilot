spring:
  application:
    name: jobpilot
  datasource:
    # 此默认值仅作兜底：JobPilotApplication.main() 会按平台算出用户目录下的
    # 绝对路径并写进系统属性覆盖它（相对路径在双击启动时必崩）
    url: jdbc:sqlite:./db/jobpilot.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1
  output:
    ansi:
      enabled: always

server:
  port: 9527

logging:
  level:
    root: INFO
    com.jobpilot: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    # 同上：实际路径由 main() 指向用户目录下的 logs/，这里只是兜底
    name: ./target/logs/jobpilot.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      db-type: sqlite

# 卡密校验配置
# enabled=false 时完全跳过校验（自用模式）
# api-base 指向 license-server 部署后的地址，例如 https://jobpilot-license.xxx.workers.dev
license:
  enabled: true
  api-base: ""
  card-key: ""
  verify-interval-minutes: 10
  grace-hours: 72
  fail-open: false

# 浏览器自动化（Boss 投递）
# headless 必须 false：扫码登录、滑块验证都要真人看窗口
# channel=chrome 用本机 Chrome（反检测最好）；留空则用 playwright 自带 chromium
browser:
  headless: false
  slow-mo-ms: 50
  channel: chrome
  width: 1440
  height: 900
