<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobPilot · 简历与画像</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f293d;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px}.wrap{max-width:1180px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:24px;margin:0 0 6px}p{margin:0;color:#69758b;font-size:13px;line-height:1.8}a{color:#4657c5;text-decoration:none}.card{background:#fff;border:1px solid #e5e9f1;border-radius:14px;padding:22px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:8px;padding:10px 15px;background:#4657c5;color:#fff;font:inherit;font-size:13px;cursor:pointer}button.secondary{background:#eef1f7;color:#35425b}button:disabled{opacity:.5;cursor:default}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.file{display:block;text-align:left;width:100%;background:#fff;color:#35425b;border:1px solid #e5e9f1;margin-bottom:8px;padding:13px;overflow-wrap:anywhere}.file.active{border-color:#7585f3;background:#f0f3ff}.file small{display:block;color:#8995aa;margin-top:7px}.title{font-size:15px;font-weight:700;overflow-wrap:anywhere;margin-bottom:15px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:#eef1f7;color:#627086}.tabs button.active{background:#4657c5;color:#fff}textarea,input[type=text]{width:100%;border:1px solid #d5dbe6;border-radius:8px;padding:12px;font:inherit;font-size:14px;line-height:1.8}textarea{min-height:400px;resize:vertical}label{display:block;color:#627086;font-size:12px;margin:14px 0 6px}.hint{font-size:12px;color:#8995aa;line-height:1.8;margin-top:12px}#status{min-height:22px;font-size:13px;margin-top:16px;color:#4657c5;overflow-wrap:anywhere}#status.error{color:#b43d3d}#report{white-space:pre-wrap;line-height:1.85;font-size:14px;min-height:400px;overflow-wrap:anywhere}#report h2{font-size:17px;color:#283650;margin:22px 0 8px}#report h3{font-size:14px;margin:18px 0 7px}#report li{margin:5px 0}#report p{color:#35425b;font-size:14px}#report .example{background:#f5f7fb;padding:12px;border-radius:8px;margin:9px 0}.empty{font-size:13px;color:#8995aa;padding:14px 0}#quota{font-size:12px;color:#8995aa;margin-left:auto}.report-note{margin-bottom:12px!important}nav{display:flex;gap:16px;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:760px){body{padding:16px}.layout{grid-template-columns:1fr}.card{padding:16px}.files{display:flex;gap:8px;overflow-x:auto}.file{min-width:190px;max-width:240px}textarea{min-height:300px}#quota{margin-left:0}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>简历与画像</h1><p>管理本地简历，用 AI 梳理职业方向与优化建议。</p></div><nav><a href="/delivery.html">投递工作台</a><a href="/ai.html">AI 配置</a><a href="/license.html">卡密管理</a></nav></header>
<div class="toolbar"><button id="import">导入简历</button><button class="secondary" id="replace" disabled>替换所选简历</button><button class="secondary" id="delete" disabled>删除本地副本</button><button class="secondary" id="refresh">刷新</button><span id="quota"></span><input type="file" id="file" accept=".pdf,.doc,.docx,.txt" hidden></div>
<div class="layout"><aside class="card"><div class="title">我的简历</div><div id="files" class="files"></div><p class="hint">PDF、Word（DOC/DOCX）、TXT<br>每份最多 10 MB。原文件保留，附件使用导入时的完整副本。</p></aside>
<section class="card"><div id="name" class="title">请先导入简历</div><div class="tabs"><button data-tab="text" class="active">简历文本 · 可修正</button><button data-tab="profile">职业画像与优化建议</button></div>
<div id="textTab"><textarea id="text" aria-label="简历文本" disabled placeholder="导入后可预览并修正文字；扫描 PDF 可粘贴文字后分析。"></textarea></div>
<div id="profileTab" hidden><div id="report" class="empty">尚未生成画像，点击 AI 分析后查看职业方向、技能与优化建议。</div></div>
<label for="target">目标岗位（选填）</label><input id="target" type="text" maxlength="200" placeholder="例如：Java 后端开发 / 新媒体运营">
<div class="actions"><button class="secondary" id="save" disabled>保存文本修正</button><button id="analyze" disabled>AI 分析画像</button><button class="secondary" id="apply" disabled>应用为 AI 话术背景</button></div>
<p class="hint">点击分析会将当前文本提交给 AI 配置中所选服务；常见电话、邮箱、证件号会先隐藏。可先删除不需要提交的信息。导入本身不会调用 AI，画像确认后再应用。</p><div id="status" role="status"></div></section></div>
</main>
<script>
const $=id=>document.getElementById(id);
let selected='',current=null,loadedText='',poll=null,replacing=false,busy=false,selectionVersion=0;
let items=[],catalogLimit=null;
async function api(path,method='GET',body){
 const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
 const result=await r.json();if(!r.ok||!result.success)throw new Error(result.message||'请求失败');return result.data;
}
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
function controls(){const valid=current?.id===selected,running=valid&&current.analysisState==='RUNNING';for(const id of ['replace','delete','save','analyze'])$(id).disabled=!valid||busy||running;$('apply').disabled=!valid||!current.profile||busy||running;$('text').disabled=!valid||busy||running;$('import').disabled=busy;$('refresh').disabled=busy;document.querySelectorAll('.file').forEach(b=>b.disabled=busy);}
function tab(name){$('textTab').hidden=name!=='text';$('profileTab').hidden=name!=='profile';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function catalog(preferred=selected){
 const result=await api('/api/resumes');items=result.items;catalogLimit=result.limit;renderFiles();
 if(!items.length){selected='';current=null;$('name').textContent='请先导入简历';$('text').value='';$('target').value='';render(null);stopPoll();status('请先导入简历。');controls();return;}
 await select(items.some(i=>i.id===preferred)?preferred:items[0].id);
}
function renderFiles(){
 $('files').replaceChildren();
 const limit=catalogLimit===null?'':` / ${catalogLimit||'不限'}`;
 $('quota').textContent=`已导入 ${items.length}${limit} 份`;
 for(const item of items){
  const button=document.createElement('button');button.className='file';button.dataset.id=item.id;button.textContent=item.name;
  const meta=document.createElement('small');meta.textContent=`${(item.size/1024).toFixed(1)} KB${item.analyzed?' · 已分析':''}`;
  button.appendChild(meta);button.onclick=()=>select(item.id).catch(e=>status('简历读取失败，请刷新重试。'+e.message,true));$('files').appendChild(button);
 }
}
function stopPoll(){if(poll){clearTimeout(poll);poll=null;}}
async function select(id,preserve=false){
 const version=++selectionVersion;
 stopPoll();
 if(!preserve){selected=id;current=null;status('正在读取简历…');controls();}
 try {
  const data=await api('/api/resumes/'+id);
  if(version===selectionVersion&&id===selected)showResume(data,preserve);
 } catch(e) {
  if(version!==selectionVersion||id!==selected)return;
  if(preserve)schedulePoll(id);
  throw e;
 }
}
function schedulePoll(id){
 stopPoll();
 poll=setTimeout(()=>select(id,true).catch(e=>status('暂时无法读取分析状态，正在重试。'+e.message,true)),2000);
}
function showResume(data,preserve=false){
 current=data;const id=data.id;
 document.querySelectorAll('.file').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 $('name').textContent=data.name+' · '+(data.size/1024).toFixed(1)+' KB';
 if(!preserve){loadedText=data.text;$('text').value=data.text;$('target').value=data.targetRole||'';}
 render(data.profile);controls();
 if(data.analysisState==='RUNNING'){status('AI 正在分析，可切换页面，结果会保留在本机。');schedulePoll(id);}
 else{stopPoll();status(data.analysisState==='FAILED'?'分析未完成：'+data.analysisError:data.warning||data.analysisError||(data.profile?'分析完成，请确认画像后再应用。':'可修正文本后开始 AI 分析。'),data.analysisState==='FAILED');}
}
function render(profile){
 const root=$('report');root.replaceChildren();root.className=profile?'':'empty';if(!profile){root.textContent='尚未生成画像，点击“AI 分析画像”开始。';return;}
 function heading(text){const h=document.createElement('h2');h.textContent=text;root.appendChild(h);}
 function paragraph(text,cls){const p=document.createElement('p');p.textContent=text;if(cls)p.className=cls;root.appendChild(p);}
 function list(title,values){heading(title);const ul=document.createElement('ul');for(const value of values||[]){const li=document.createElement('li');li.textContent=value;ul.appendChild(li);}root.appendChild(ul);}
 heading('职业画像');paragraph(profile.summary);list('适合的岗位方向',profile.suitableRoles);list('已有技能',profile.skills);list('简历优势',profile.strengths);heading('优先优化点');
 for(const issue of profile.improvements||[]){const h=document.createElement('h3');h.textContent=`【${issue.priority}】${issue.issue}`;root.appendChild(h);paragraph('依据：'+issue.evidence);paragraph('建议：'+issue.suggestion);if(issue.example)paragraph('改写参考：'+issue.example,'example');}
 list('待补充信息',profile.missingInformation);heading('可用于 AI 话术的背景（确认后应用）');paragraph(profile.persona);
}
async function action(task){if(busy)return;busy=true;controls();try{await task();}catch(e){status(e.message,true);}finally{busy=false;controls();}}
$('refresh').onclick=()=>action(()=>catalog());
$('import').onclick=()=>{replacing=false;$('file').click();};$('replace').onclick=()=>{replacing=true;$('file').click();};
$('file').onchange=()=>action(async()=>{
 const file=$('file').files[0];$('file').value='';if(!file)return;if(file.size>10*1024*1024)throw new Error('简历文件不能超过 10 MB');status('正在导入和解析简历…');
 const path='/api/resumes/import?filename='+encodeURIComponent(file.name)+(replacing?'&replaceId='+selected:'');
 const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});const body=await response.json();if(!body.success)throw new Error(body.message);
 selectionVersion++;stopPoll();items=[body.data,...items.filter(item=>!replacing||item.id!==selected)];selected=body.data.id;
 renderFiles();showResume(body.data);tab('text');
});
$('delete').onclick=()=>action(async()=>{if(!selected||!confirm('删除 JobPilot 中的副本和分析结果？原文件保留。'))return;await api('/api/resumes/'+selected,'DELETE');current=null;await catalog('');});
$('save').onclick=()=>action(async()=>{await api('/api/resumes/'+selected+'/text','PUT',{text:$('text').value});await select(selected);status('文本修正已保存，原附件未修改。');});
$('analyze').onclick=()=>action(async()=>{
 if(!selected)return;
 const content=$('text').value;
 if(content.trim().length<30){tab('text');status('请在简历文本中粘贴或补充至少 30 字，再点击 AI 分析画像。',true);return;}
 if(content!==loadedText)await api('/api/resumes/'+selected+'/text','PUT',{text:content});
 const data=await api('/api/resumes/'+selected+'/analyze','POST',{targetRole:$('target').value});
 showResume(data);tab('profile');
});
$('apply').onclick=()=>action(async()=>{await api('/api/resumes/'+selected+'/apply-persona','POST');status('已更新 AI 话术背景；接口、Key 和各平台话术选择保留。');});
action(()=>catalog());
</script></body></html>
