name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mirror_tag:
        description: '仅镜像下载站中已验收的 macOS 包到已有 Release（空值正常构建）'
        type: string
        default: ''
      mirror_macos_sha256:
        description: '镜像包的已核验 SHA-256'
        type: string
        default: ''

# 打包流程。设计要点（都是本地实测踩过坑后固化的）：
#   1. jdeps 对 Spring Boot fat jar 会漏报模块（看不进 BOOT-INF/lib），
#      模块清单必须手写并用实跑验证，不能靠工具推断
#   2. jpackage 输入目录里只能放 fat jar 一个文件，plain jar 同时在时
#      两条 classpath 在 cfg 里互相覆盖，类路径只剩空壳
#   3. Spring Boot fat jar 的主类是 JarLauncher，别指定 --main-class
#   4. Windows 用 app-image（不依赖 WiX），macOS 用 dmg
jobs:
  mirror-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.mirror_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 镜像已验收的 macOS 安装包
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.mirror_tag }}
          EXPECTED_SHA256: ${{ inputs.mirror_macos_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          FILE="JobPilot-${RELEASE_TAG#v}.dmg"
          curl -fL --retry 5 --retry-all-errors --output "$FILE" "https://getjobs.dpdns.org/download/$FILE"
          echo "$EXPECTED_SHA256  $FILE" | sha256sum --check
          gh release upload "$RELEASE_TAG" "$FILE" --clobber

  # 卡密服务端管计费：它的测试挂了不该照样出包（plans.test 曾过期一个月没人发现）
  license-server:
    if: inputs.mirror_tag == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: license-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: license-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    # 默认 token 是只读的：建 Release 会 403（v1.0.9 和 v1.0.10 两次实测同一个错，
    # 报 "Resource not accessible by integration"）。不加这行 Release 永远挂不上
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 构建并跑测试
        run: ./gradlew build

      # 测试挂了把报告传上来：Windows 上的失败在本地复现不了，
      # 没有 XML 就只能看 Gradle 的摘要行猜
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: build/test-results/test/*.xml
          retention-days: 7

      - name: 准备随包 Chromium
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/build/bundled-browser"
          node build/patchright-driver/package/cli.js install chromium --no-shell --no-progress
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('./build/patchright-driver/package/index.js');
          const root = process.env.PLAYWRIGHT_BROWSERS_PATH;
          const executable = chromium.executablePath();
          if (!fs.existsSync(executable)) throw new Error('缺少随包 Chromium');
          fs.writeFileSync(path.join(root, 'executable.txt'), path.relative(root, executable));
          JS
          rm -rf build/bundled-browser/.links

      - name: 验证暂停恢复与聊天附件实跑（隔离测试页面）
        run: ./gradlew resumeSmoke

      - name: 裁剪运行时（模块清单经实跑验证，勿用 jdeps 推断）
        run: |
          jlink --add-modules java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.unsupported,jdk.charsets \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 \
            --output build/runtime

      - name: 打包 app-image（两个平台通用，也是冒烟测试的对象）
        run: |
          mkdir -p build/stage
          cp build/libs/jobpilot-0.1.0.jar build/stage/
          # app-version 首段不能为 0：macOS dmg 打包器会直接拒（实测报
          # "The first number in an app-version cannot be zero or negative"）
          # 卡密服务端地址烧进 cfg：装机版双击启动时没有地方传命令行参数，
          # api-base 留空就连不上服务端，用户看到的永远是"未激活"。
          # 系统属性优先级低于命令行参数，本地联调仍可用
          # --license.api-base=http://127.0.0.1:8787 覆盖
          # 应用图标：macOS 吃 .icns，Windows 吃 .ico（源图和生成脚本见 packaging/icon）。
          # dmg 由这个 app-image 转出来，图标跟着走，不用再传
          ICON=packaging/icon/JobPilot.ico
          [ "$RUNNER_OS" = "macOS" ] && ICON=packaging/icon/JobPilot.icns
          jpackage --type app-image --name JobPilot --app-version 1.0.28 \
            --input build/stage --main-jar jobpilot-0.1.0.jar \
            --runtime-image build/runtime --dest build/dist \
            --icon "$ICON" \
            --java-options "-Dlicense.api-base=https://getjobs.dpdns.org"
          # jpackage 会尝试重新签名嵌套浏览器，先创建应用再加入已签名的 Chromium。
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/bundled-browser build/dist/JobPilot.app/Contents/app/browser
            codesign --force --sign - build/dist/JobPilot.app
            codesign --verify --deep build/dist/JobPilot.app
          else
            cp -R build/bundled-browser build/dist/JobPilot/app/browser
          fi
          # 图标真进了包才算数：jpackage 找不到图标文件只会警告、照样出包
          if [ "$RUNNER_OS" = "macOS" ]; then
            [ -f build/dist/JobPilot.app/Contents/Resources/JobPilot.icns ] || { echo "::error::app 里没有 JobPilot.icns"; exit 1; }
          fi

      - name: Windows 启动器支持中文路径
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows-utf8.ps1 -Executable build/dist/JobPilot/JobPilot.exe

      - name: 随包浏览器实跑（不使用系统 Chrome 或 Edge）
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export JOBPILOT_BROWSER_ROOT="$PWD/build/dist/JobPilot.app/Contents/app/browser"
          else
            export JOBPILOT_BROWSER_ROOT="$PWD/build/dist/JobPilot/app/browser"
          fi
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('./build/patchright-driver/package/index.js');
          (async () => {
            const root = process.env.JOBPILOT_BROWSER_ROOT;
            const executablePath = path.join(root, fs.readFileSync(path.join(root, 'executable.txt'), 'utf8').trim());
            const browser = await chromium.launch({ executablePath, headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent('<main>JobPilot bundled browser</main>');
              assert.equal(await page.locator('main').textContent(), 'JobPilot bundled browser');
              console.log('随包 Chromium 启动与网页渲染通过');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS

      - name: 冒烟测试（打包产物真跑一次：health + driver/node 解压 + 根路径跳转）
        shell: bash
        run: |
          # 必须离开仓库根目录再启动：driver 候选里有一项是"当前目录下的
          # build/patchright-driver"（开发态兜底），在仓库根目录启动会认领开发态
          # driver，node 就不会解压到用户数据目录，后面的 node/cli.js 校验等于没验。
          # 最终用户双击启动时的工作目录也不是仓库根目录，这样才贴合真实场景
          cd "${RUNNER_TEMP:-/tmp}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="$GITHUB_WORKSPACE/build/dist/JobPilot.app/Contents/MacOS/JobPilot"
            NODE="$HOME/Library/Application Support/JobPilot/driver/node"
          else
            APP="$GITHUB_WORKSPACE/build/dist/JobPilot/JobPilot.exe"
            NODE="$APPDATA/JobPilot/driver/node.exe"
          fi
          rm -rf "$(dirname "$NODE")"
          # CI 里禁用桌面窗口；本机 API 和打包资源仍按完整启动链路冒烟。
          "$APP" --server.port=18080 --license.enabled=false --jobpilot.console=false &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:18080/api/health && break
            sleep 1
          done
          curl -sf http://localhost:18080/api/health || { echo "::error::打包产物启动失败"; exit 1; }
          # 根路径必须跳到前端页而不是 404（回归过一次）
          curl -sf -o /dev/null http://localhost:18080/ || { echo "::error::根路径不可达"; exit 1; }
          # 打包版没有 node 也能跑：node 必须从 jar 里的 driver-bundle 解压出来
          [ -x "$NODE" ] || { echo "::error::driver 目录里没有解压出的 node: $NODE"; exit 1; }
          "$NODE" --version || { echo "::error::解压出的 node 跑不起来"; exit 1; }
          # patchright 的 cli.js 必须是真身：npm 包里的 cli.js 只有 12 字节的占位
          CLI="$(dirname "$NODE")/package/cli.js"
          [ "$(wc -c < "$CLI")" -gt 100 ] || { echo "::error::cli.js 疑似占位文件: $CLI"; exit 1; }
          node <<'JS'
          const fs = require('node:fs');
          (async () => {
            for (const [file, text] of [['resume-gb18030.txt', '职业目标'], ['resume-synthetic.docx', '候选人'], ['apache-poi-simple.doc', 'simple']]) {
              const content = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/src/test/resources/fixtures/' + file);
              const response = await fetch('http://127.0.0.1:18080/api/resumes/import?filename=' + encodeURIComponent(file), {
                method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: content
              });
              const result = await response.json();
              if (!result.success || !result.data.text.toLowerCase().includes(text.toLowerCase())) throw new Error('运行时简历解析失败：' + file);
              console.log('打包运行时简历解析通过：' + file);
              await fetch('http://127.0.0.1:18080/api/resumes/' + result.data.id, { method: 'DELETE' });
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          kill $APP_PID

      # dmg 只能从 app-image 转：直接 --type dmg 时 jpackage 会把中间 .app 删掉，
      # 之后既没法冒烟测试也没法 zip。所以固定走"先 app-image，测完再转 dmg"。
      - name: macOS 转 dmg
        if: runner.os == 'macOS'
        run: |
          jpackage --type dmg --name JobPilot --app-version 1.0.28 \
            --app-image build/dist/JobPilot.app --dest build/dist
          rm -rf build/dist/JobPilot.app

      - name: Windows 产物打 zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/dist/JobPilot -DestinationPath JobPilot-windows.zip

      - name: 获取正式 1.0.27 客户端（验证旧版接收更新）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/previous
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release download v1.0.27 --pattern 'JobPilot-1.0.27.dmg' --dir build/previous
          else
            gh release download v1.0.27 --pattern 'JobPilot-windows.zip' --dir build/previous
          fi

      - name: 验证一键升级与失败回滚
        run: ./gradlew updaterSmoke

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-${{ runner.os }}
          path: |
            build/dist/*.dmg
            JobPilot-windows.zip
          if-no-files-found: error

      - name: 附到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 每个 job 只产出一个平台的包，却想往同一个 release 上挂两个文件：
          # 直接 gh release create 传全列表会在 mac 上找不到 win zip、win 上找不到
          # dmg 而整步红掉（v1.0.9 实测）。所以 release 先建后传，各自只传自己那份。
          TAG="${GITHUB_REF_NAME}"
          FILES=""
          ls build/dist/*.dmg >/dev/null 2>&1 && FILES="build/dist/*.dmg"
          [ -f JobPilot-windows.zip ] && FILES="$FILES JobPilot-windows.zip"
          # 正式更新前先收集两端的已验收产物。
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "JobPilot $TAG" --generate-notes
          gh release upload "$TAG" $FILES --clobber
