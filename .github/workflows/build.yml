name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 打包流程。设计要点（都是本地实测踩过坑后固化的）：
#   1. jdeps 对 Spring Boot fat jar 会漏报模块（看不进 BOOT-INF/lib），
#      模块清单必须手写并用实跑验证，不能靠工具推断
#   2. jpackage 输入目录里只能放 fat jar 一个文件，plain jar 同时在时
#      两条 classpath 在 cfg 里互相覆盖，类路径只剩空壳
#   3. Spring Boot fat jar 的主类是 JarLauncher，别指定 --main-class
#   4. Windows 用 app-image（不依赖 WiX），macOS 用 dmg
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 构建并跑测试
        run: ./gradlew build

      # 测试挂了把报告传上来：Windows 上的失败在本地复现不了，
      # 没有 XML 就只能看 Gradle 的摘要行猜
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: build/test-results/test/*.xml
          retention-days: 7

      - name: 裁剪运行时（模块清单经实跑验证，勿用 jdeps 推断）
        run: |
          jlink --add-modules java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.unsupported \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 \
            --output build/runtime

      - name: 打包 app-image（两个平台通用，也是冒烟测试的对象）
        run: |
          mkdir -p build/stage
          cp build/libs/jobpilot-0.1.0.jar build/stage/
          # app-version 首段不能为 0：macOS dmg 打包器会直接拒（实测报
          # "The first number in an app-version cannot be zero or negative"）
          # 卡密服务端地址烧进 cfg：装机版双击启动时没有地方传命令行参数，
          # api-base 留空就连不上服务端，用户看到的永远是"未激活"。
          # 系统属性优先级低于命令行参数，本地联调仍可用
          # --license.api-base=http://127.0.0.1:8787 覆盖
          jpackage --type app-image --name JobPilot --app-version 1.0.10 \
            --input build/stage --main-jar jobpilot-0.1.0.jar \
            --runtime-image build/runtime --dest build/dist \
            --java-options "-Dlicense.api-base=https://getjobs.dpdns.org"

      - name: 冒烟测试（打包产物真跑一次：health + driver/node 解压 + 根路径跳转）
        shell: bash
        run: |
          # 必须离开仓库根目录再启动：driver 候选里有一项是"当前目录下的
          # build/patchright-driver"（开发态兜底），在仓库根目录启动会认领开发态
          # driver，node 就不会解压到用户数据目录，后面的 node/cli.js 校验等于没验。
          # 最终用户双击启动时的工作目录也不是仓库根目录，这样才贴合真实场景
          cd "${RUNNER_TEMP:-/tmp}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="$GITHUB_WORKSPACE/build/dist/JobPilot.app/Contents/MacOS/JobPilot"
            NODE="$HOME/Library/Application Support/JobPilot/driver/node"
          else
            APP="$GITHUB_WORKSPACE/build/dist/JobPilot/JobPilot.exe"
            NODE="$APPDATA/JobPilot/driver/node.exe"
          fi
          rm -rf "$(dirname "$NODE")"
          # CI 里禁用桌面窗口；本机 API 和打包资源仍按完整启动链路冒烟。
          "$APP" --server.port=18080 --license.enabled=false --jobpilot.console=false &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:18080/api/health && break
            sleep 1
          done
          curl -sf http://localhost:18080/api/health || { echo "::error::打包产物启动失败"; exit 1; }
          # 根路径必须跳到前端页而不是 404（回归过一次）
          curl -sf -o /dev/null http://localhost:18080/ || { echo "::error::根路径不可达"; exit 1; }
          # 打包版没有 node 也能跑：node 必须从 jar 里的 driver-bundle 解压出来
          [ -x "$NODE" ] || { echo "::error::driver 目录里没有解压出的 node: $NODE"; exit 1; }
          "$NODE" --version || { echo "::error::解压出的 node 跑不起来"; exit 1; }
          # patchright 的 cli.js 必须是真身：npm 包里的 cli.js 只有 12 字节的占位
          CLI="$(dirname "$NODE")/package/cli.js"
          [ "$(wc -c < "$CLI")" -gt 100 ] || { echo "::error::cli.js 疑似占位文件: $CLI"; exit 1; }
          kill $APP_PID

      # dmg 只能从 app-image 转：直接 --type dmg 时 jpackage 会把中间 .app 删掉，
      # 之后既没法冒烟测试也没法 zip。所以固定走"先 app-image，测完再转 dmg"。
      - name: macOS 转 dmg
        if: runner.os == 'macOS'
        run: |
          jpackage --type dmg --name JobPilot --app-version 1.0.10 \
            --app-image build/dist/JobPilot.app --dest build/dist
          rm -rf build/dist/JobPilot.app

      - name: Windows 产物打 zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/dist/JobPilot -DestinationPath JobPilot-windows.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-${{ runner.os }}
          path: |
            build/dist/*.dmg
            JobPilot-windows.zip
          if-no-files-found: error

      - name: 附到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 每个 job 只产出一个平台的包，却想往同一个 release 上挂两个文件：
          # 直接 gh release create 传全列表会在 mac 上找不到 win zip、win 上找不到
          # dmg 而整步红掉（v1.0.9 实测）。所以 release 先建后传，各自只传自己那份。
          TAG="${GITHUB_REF_NAME}"
          FILES=""
          ls build/dist/*.dmg >/dev/null 2>&1 && FILES="build/dist/*.dmg"
          [ -f JobPilot-windows.zip ] && FILES="$FILES JobPilot-windows.zip"
          # 两个 job 抢同一个 tag：谁先到谁建，后到的 create 失败就直接传
          gh release create "$TAG" --title "JobPilot $TAG" --generate-notes || true
          gh release upload "$TAG" $FILES --clobber
