name: Verify released JobPilot delivery workbench
on:
  push:
    branches: ['codex/verify-v1-0-30-download']
    paths: ['.github/workflows/v30-release-preview.yml', 'qa/v30-release/**']
permissions:
  contents: read
jobs:
  official-preview:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            package: windows-full
          - host: windows-latest
            package: windows-lite
          - host: macos-latest
            package: macos
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Launch and preview in the exact published package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python qa/v30-release/check_release.py ${{ matrix.package }}
